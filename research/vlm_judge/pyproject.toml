[project]
name = "vlm-judge"
version = "0.1.0"
description = "Research-only VLM makeup evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "openai>=3.42.1",
    "pillow>=13.0.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "typer>=0.27.3",
]

[project.scripts]
vlm-judge = "vlm_judge:main"

[project.optional-dependencies]
vision = [
    "mediapipe>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
