<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>립 자연스러움 평가</title><style>
body{font-family:system-ui,sans-serif;margin:auto;max-width:1100px;padding:16px;color:#202736;background:#f6f7fb}h1{font-size:1.4rem}button,input,textarea{font:inherit}button{cursor:pointer;padding:8px 12px;margin:3px;border:1px solid #abb5c6;border-radius:7px;background:white}button[aria-pressed=true]{background:#253d65;color:white}.panel{background:#fff;border-radius:10px;padding:16px;margin:12px 0}.photos{display:flex;gap:12px;align-items:start;flex-wrap:wrap}.photos img{object-fit:contain;max-width:100%}#whole{width:140px;max-height:180px}#detail{width:180px;max-height:180px;cursor:zoom-in}.sticky{position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #0002}.sticky figure{margin:2px}.sticky p{margin:3px}.question{border-top:1px solid #ddd;padding:8px 0}.line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0;scroll-margin-top:270px}.line.active{outline:2px solid #253d65}.line span{flex:1;min-width:250px}.notice{color:#9b2323}progress{width:100%}dialog img{max-width:40vw;max-height:55vh}textarea{width:100%;box-sizing:border-box}label{display:block;margin:6px 0}#attributes{font-weight:bold;font-size:1.25rem}
</style></head><body>
<h1>립 자연스러움 평가</h1>
<p>이름 대신 평가자 코드(R1, R2 등)를 사용하세요. 사진의 제품색 정확도보다 입술 표현의 자연스러움을 평가합니다.</p>
<div class="panel" id="setup"><label>평가자 코드 <input id="rater" placeholder="R1" autocomplete="off"></label><label>채점 묶음 폴더 선택 <input id="folder" type="file" webkitdirectory multiple></label><button id="begin">시작 / 이어서 하기</button><p id="setupMsg" class="notice"></p></div>
<main id="app" hidden><div class="panel sticky"><p id="progressLabel"></p><progress id="progress"></progress><p id="attributes"></p><p id="exercise"></p><div class="photos"><figure><img id="whole" alt="전체 사진"><figcaption>전체 화면</figcaption></figure><figure><img id="detail" alt="입술 확대"><figcaption>입술 확대 · 누르면 크게 보기</figcaption></figure></div></div>
<div class="panel" id="items"></div><div class="panel"><h2>전체 인상</h2><div id="overall"></div><label>메모 (선택)<textarea id="note" rows="2"></textarea></label><p id="message" class="notice"></p><button id="previous">이전</button><button id="next">다음</button><button id="export">CSV 내보내기</button></div></main>
<dialog id="zoom"><img id="zoomImage" alt="확대 이미지"><button onclick="document.getElementById('zoom').close()">닫기</button></dialog>
<dialog id="help"><div id="helpBody"></div><button onclick="document.getElementById('help').close()">닫기</button></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let files={},pack,rubric,guide={},packHash='',code='',state,storeKey='',started=0,focusIndex=0;const imageUrls={};
const sha=async bytes=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const x=new Uint32Array(1);crypto.getRandomValues(x);const j=x[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function findFile(name){const f=files[name];if(!f)throw Error('채점에 필요한 파일이 없습니다. 담당자에게 문의하세요.');return f}
async function orderItems(items){const hashes={};for(const item of items)hashes[item.id]=await sha(await findFile('images/'+item.id+'_full.png').arrayBuffer());
 const originals=items.filter(x=>!x.is_repeat), repeats=items.filter(x=>x.is_repeat);
 for(let attempt=0;attempt<500;attempt++){let ordered=shuffle(originals.slice()),ok=true;
  for(const r of shuffle(repeats.slice())){let matching=ordered.map((x,i)=>hashes[x.id]===hashes[r.id]?i:-1).filter(x=>x>=0);if(!matching.length){ok=false;break}let min=Math.max(...matching)+16;if(min>ordered.length){ok=false;break}let slots=[];for(let i=min;i<=ordered.length;i++)slots.push(i);ordered.splice(shuffle(slots)[0],0,r)}
  if(ok)return ordered.map(x=>x.id)}throw Error('반복 장면 사이의 15장 간격을 만들 수 없습니다.');}
function save(){const saved=state.practice?{...state,index:0,answers:{}}:state;localStorage.setItem(storeKey,JSON.stringify(saved))}
function current(){return state.order[state.index]}
function entry(id){return state.answers[id]||(state.answers[id]={checks:{},overall:null,note:'',seconds:0})}
function checkpoint(){if(!state||!started)return;let e=entry(current());e.seconds+=(Date.now()-started)/1000;started=Date.now();save()}
function allowed(c,finish){return c.na_allowed===true||(c.na_allowed&&Array.isArray(c.na_allowed.finish)&&c.na_allowed.finish.includes(finish))}
function revealHelp(c){const box=$('helpBody');box.replaceChildren();const ex=guide[c.id];if(!ex){box.textContent='시범 채점 후 추가 예정';$('help').showModal();return}for(const side of ['pass','fail']){const p=document.createElement('p');p.textContent=(side==='pass'?'예: ':'아니오: ')+(ex[side]?.text||'');box.append(p);if(ex[side]?.image&&files[ex[side].image]){const img=document.createElement('img');img.src=URL.createObjectURL(files[ex[side].image]);box.append(img)}}$('help').showModal()}
function img(id,suffix){const key=id+'_'+suffix,dir=state.practice?'practice':'images',cache=dir+'/'+key;if(!imageUrls[cache])imageUrls[cache]=URL.createObjectURL(findFile(dir+'/'+key+'.png'));return imageUrls[cache]}
function show(){const id=current(), item=(state.practice?pack.practice:pack.items).find(x=>x.id===id), e=entry(id);started=Date.now();const times=Object.values(state.answers).filter(x=>Number.isInteger(x.overall)&&Object.keys(x.checks).length===25).map(x=>x.seconds).sort((a,b)=>a-b), med=times.length?times.length%2?times[(times.length-1)/2]:(times[times.length/2-1]+times[times.length/2])/2:0, remaining=state.order.length-state.index;$('progressLabel').textContent=(state.practice?'연습 ':'본 채점 ')+(state.index+1)+' / '+state.order.length+(state.practice?'':` · 남은 ${remaining}장 · 예상 ${med?Math.ceil(med*remaining/60)+'분':'계산 대기'}`);$('progress').max=state.order.length;$('progress').value=state.index+1;$('exercise').textContent=state.practice?'연습 결과는 저장·내보내기에서 제외됩니다.':'단축키 Y: 예 · N: 아니오 · A: 해당 없음';$('attributes').textContent='제형: '+({matte:'매트',satin:'새틴',glossy:'글로시',unknown:'확인 안 됨'}[item.finish]||item.finish)+' · 입 상태: '+({open:'벌림',closed:'다묾'}[item.mouth]||item.mouth);$('whole').src=img(id,'full');$('detail').src=img(id,'crop');$('items').replaceChildren();
 let n=0;for(const q of rubric.questions){const section=document.createElement('section');section.className='question';const heading=document.createElement('h2');heading.textContent=q.title;section.append(heading);const hint=document.createElement('p');hint.textContent=q.hint;section.append(hint);for(const c of q.checks){const ix=n++;const line=document.createElement('div');line.className='line'+(ix===focusIndex?' active':'');line.onclick=()=>{focusIndex=ix;document.querySelectorAll('.line').forEach((el,j)=>el.classList.toggle('active',j===ix))};const text=document.createElement('span');text.textContent=c.text;line.append(text);for(const [v,label] of [['1','예'],['0','아니오'],...(allowed(c,item.finish)?[['na','해당 없음']]:[])]){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(e.checks[c.id]===v));b.onclick=(event)=>{event.stopPropagation();checkpoint();e.checks[c.id]=v;focusIndex=Math.min(ix+1,24);save();show()};line.append(b)}const help=document.createElement('button');help.textContent='?';help.onclick=()=>revealHelp(c);line.append(help);section.append(line)}$('items').append(section)}
 $('overall').replaceChildren();for(let n=1;n<=5;n++){let b=document.createElement('button');b.textContent=n+' · '+rubric.overall.scale[String(n)];b.setAttribute('aria-pressed',String(e.overall===n));b.onclick=()=>{checkpoint();e.overall=n;save();show()};$('overall').append(b)}$('note').value=e.note||'';$('message').textContent='';$('previous').disabled=state.index===0;save()}
 function complete(){let e=entry(current());return rubric.questions.every(q=>q.checks.every(c=>e.checks[c.id]!==undefined))&&Number.isInteger(e.overall)}
 $('begin').onclick=async()=>{try{code=$('rater').value.trim().toUpperCase();if(!/^R\d+$/.test(code))throw Error('이름이 아닌 평가자 코드 R1, R2 등을 입력하세요.');let selected=[...$('folder').files];if(!selected.length)throw Error('채점 묶음 폴더를 선택하세요.');files={};for(const f of selected){let parts=f.webkitRelativePath.split('/');parts.shift();files[parts.join('/')]=f}const raw=await findFile('pack.json').arrayBuffer();packHash=await sha(raw);pack=JSON.parse(new TextDecoder().decode(raw));rubric=JSON.parse(await findFile('rubric.json').text());if(rubric.version!=='lip-rubric-v2'||pack.practice?.length!==3)throw Error('v2 묶음과 연습 사진 3장이 필요합니다.');if(files['guide.json'])guide=JSON.parse(await files['guide.json'].text());storeKey='lip-rubric:'+code+':'+packHash;let saved=localStorage.getItem(storeKey);if(saved)state=JSON.parse(saved);else{let order=await orderItems(pack.items);state={mainOrder:order,order:pack.practice.map(x=>x.id),index:0,answers:{},practice:true};save()}$('setup').hidden=true;$('app').hidden=false;show()}catch(e){$('setupMsg').textContent=String(e.message||e)}};
 $('next').onclick=()=>{checkpoint();if(!complete()){$('message').textContent='모든 항목과 전체 인상에 답해 주세요.';return}focusIndex=0;if(state.index+1<state.order.length){state.index++;show();return}if(state.practice){state.practice=false;state.order=state.mainOrder;state.index=0;state.answers={};save();show();return}$('message').textContent='채점 완료. CSV를 내려받아 담당자에게 보내주세요.';save()};
 $('previous').onclick=()=>{checkpoint();if(state.index>0){state.index--;focusIndex=0;show()}};$('note').oninput=e=>{entry(current()).note=e.target.value;save()};
 $('export').onclick=()=>{checkpoint();if(state.practice){$('message').textContent='연습 결과는 내보내지 않습니다.';return}const ids=rubric.questions.flatMap(q=>q.checks.map(c=>c.id));const cols=['rater_id','image_id','is_repeat','order_index',...ids,'overall','seconds','note','pack_hash','rubric_version'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[cols];state.order.forEach((id,i)=>{let e=state.answers[id];if(!e)return;let info=pack.items.find(x=>x.id===id);rows.push([code,id,info.is_repeat?1:0,i+1,...ids.map(k=>e.checks[k]??''),e.overall??'',Math.round(e.seconds),e.note,packHash,rubric.version])});let blob=new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=code+'_ratings.csv';a.click()};
 $('detail').onclick=()=>{$('zoomImage').src=$('detail').src;$('zoom').showModal()};window.addEventListener('beforeunload',checkpoint);
 window.addEventListener('keydown',event=>{if(!state||$('app').hidden||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.querySelector('dialog[open]'))return;const key=event.key.toLowerCase(),v={y:'예',n:'아니오',a:'해당 없음'}[key];if(!v)return;const line=$('items').querySelectorAll('.line')[focusIndex],button=[...line.querySelectorAll('button')].find(b=>b.textContent===v);if(button){event.preventDefault();button.click();$('items').querySelectorAll('.line')[focusIndex]?.scrollIntoView({block:'nearest'})}});
})();
</script></body></html>
