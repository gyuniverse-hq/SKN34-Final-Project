# Shared dev servers on Render (free plan). Create once: Render dashboard → New → Blueprint →
# this repository, branch develop, Blueprint path infra/render/render.yaml. See docs/DEPLOYMENT.md.
# Data stores are external: Supabase (PostgreSQL) and Neo4j AuraDB Free. No Redis on the free plan:
# the api runs without a cache and rate limits are kept in memory.
services:
  - type: web
    name: vishue-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/gyuniverse-hq/SKN34-Final-Project
    branch: develop
    rootDir: backend/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy only after the commit's GitHub checks (ci-ok) pass.
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["backend/api/**", "infra/render/render.yaml"]
    envVars:
      - key: ENV
        value: development
      - key: RUN_MIGRATIONS
        value: "true"
      # Enable only after the separate G5 migration and verified data restore.
      - key: G5_ENABLED
        value: "false"
      - key: G5_ALLOW_LOCAL_SOURCES
        value: "false"
      - key: G5_OPENAI_API_KEY
        sync: false
      - key: G5_INTERNAL_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:8081"]'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: PAYMENT_WEB_BASE_URL
        sync: false

  - type: web
    name: vishue-chatbot
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/gyuniverse-hq/SKN34-Final-Project
    branch: develop
    rootDir: backend/chatbot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["backend/chatbot/**", "infra/render/render.yaml"]
    envVars:
      - key: ENV
        value: development
      - key: G1_SUPERVISOR_ENABLED
        value: "true"
      - key: G5_ENABLED
        value: "false"
      # Full API base URL; never the chatbot's localhost address.
      - key: CATALOG_API_URL
        sync: false
      - key: G5_OPENAI_API_KEY
        sync: false
      # Must match the API service's G5_INTERNAL_TOKEN.
      - key: G5_INTERNAL_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["http://localhost:8081"]'
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
