# Apply after External Secrets has created namespace vishue (or create the ns first).
# Pod Identity association is defined in infra/terraform/aws/eks.tf (vishue-restore).
apiVersion: v1
kind: Namespace
metadata:
  name: vishue
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vishue-restore
  namespace: vishue
  labels:
    app.kubernetes.io/name: vishue
    app.kubernetes.io/component: restore
