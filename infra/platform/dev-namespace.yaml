# Dev environment namespace. The GitHub dev deploy role (EKS access entry, Kubernetes group
# vishue-dev-deployers) gets full control here and nowhere else. Apply once per cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: vishue-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: vishue-dev
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: vishue-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: vishue-dev-deployers
