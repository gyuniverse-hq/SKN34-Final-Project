# EKS only, applied once after installing External Secrets Operator.
# No auth block: the operator uses its own AWS identity (EKS Pod Identity or IRSA) with
# secretsmanager:GetSecretValue on arn:aws:secretsmanager:ap-northeast-2:<account>:secret:vishue/production/*
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
