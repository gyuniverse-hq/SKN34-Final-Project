{{- $fullname := include "vishue.fullname" . -}}
{{- $ds := .Values.dataStores -}}
{{- if or $ds.postgres.enabled $ds.neo4j.enabled }}
# In-cluster data stores are for local (kind) and dev only. Production uses managed services
# (RDS, ElastiCache, AuraDB) through the service Secrets instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-datastores
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ds.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $ds.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://vishue:%s@%s-postgres:5432/vishue" $ds.postgres.password $fullname | quote }}
  {{- end }}
  {{- if $ds.neo4j.enabled }}
  NEO4J_AUTH: {{ printf "neo4j/%s" $ds.neo4j.password | quote }}
  NEO4J_PASSWORD: {{ $ds.neo4j.password | quote }}
  {{- end }}
{{- end }}
{{- if $ds.postgres.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "vishue.selector" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vishue.selector" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ $ds.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: vishue }
            - { name: POSTGRES_DB, value: vishue }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $fullname }}-datastores, key: POSTGRES_PASSWORD }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vishue", "-d", "vishue"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $ds.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vishue.selector" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
{{- end }}
{{- if $ds.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vishue.selector" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vishue.selector" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ $ds.redis.image }}
          args: ["--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vishue.selector" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
{{- if $ds.neo4j.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-neo4j
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      {{- include "vishue.selector" (dict "root" $ "component" "neo4j") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vishue.selector" (dict "root" $ "component" "neo4j") | nindent 8 }}
    spec:
      containers:
        - name: neo4j
          image: {{ $ds.neo4j.image }}
          # The image reads every NEO4J_* variable as a setting: pass only real settings here.
          env:
            - { name: NEO4J_server_memory_heap_max__size, value: 512m }
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef: { name: {{ $fullname }}-datastores, key: NEO4J_AUTH }
          ports:
            - { name: bolt, containerPort: 7687 }
            - { name: browser, containerPort: 7474 }
          readinessProbe:
            tcpSocket: { port: bolt }
            periodSeconds: 10
            initialDelaySeconds: 20
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $ds.neo4j.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-neo4j
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vishue.selector" (dict "root" $ "component" "neo4j") | nindent 4 }}
  ports:
    - { name: bolt, port: 7687, targetPort: bolt }
    - { name: browser, port: 7474, targetPort: browser }
{{- end }}
