{{- if .Values.networkPolicy.enabled }}
{{- /* target component => list of allowed sources (pod components, or "gateway") */ -}}
{{- $rules := dict "api" (list "gateway" "sync-graph") "chatbot" (list "gateway") -}}
{{- $ds := .Values.dataStores -}}
{{- if $ds.postgres.enabled }}
{{- $_ := set $rules "postgres" (list "api" "seed") -}}
{{- end }}
{{- if $ds.redis.enabled }}
{{- $_ := set $rules "redis" (list "api" "chatbot" "seed") -}}
{{- end }}
{{- if $ds.neo4j.enabled }}
{{- $_ := set $rules "neo4j" (list "chatbot" "sync-graph") -}}
{{- end }}
{{- range $target, $sources := $rules }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vishue.fullname" $ }}-{{ $target }}
  labels:
    {{- include "vishue.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vishue.selector" (dict "root" $ "component" $target) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $source := $sources }}
        {{- if eq $source "gateway" }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.gatewayNamespace }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- include "vishue.selector" (dict "root" $ "component" $source) | nindent 14 }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
