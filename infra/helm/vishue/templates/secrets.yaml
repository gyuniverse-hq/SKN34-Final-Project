{{- if and .Values.secrets.create .Values.externalSecrets.enabled }}
{{- fail "Use either secrets.create (local) or externalSecrets.enabled (production), not both." }}
{{- end }}
{{- if .Values.secrets.create }}
{{- range $c := list "api" "chatbot" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vishue.fullname" $ }}-{{ $c }}
  labels:
    {{- include "vishue.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := index $.Values.secrets $c }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.externalSecrets.enabled }}
{{- range $c, $key := dict "api" .Values.externalSecrets.apiKey "chatbot" .Values.externalSecrets.chatbotKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vishue.fullname" $ }}-{{ $c }}
  labels:
    {{- include "vishue.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.storeRef.kind }}
    name: {{ $.Values.externalSecrets.storeRef.name }}
  target:
    name: {{ include "vishue.fullname" $ }}-{{ $c }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $key }}
{{- end }}
{{- end }}
