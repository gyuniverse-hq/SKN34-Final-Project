{{- if .Values.gateway.enabled }}
{{- $fullname := include "vishue.fullname" . -}}
{{- $tls := .Values.gateway.tls.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
    {{- if $tls }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.tls.certificateSecret is required when TLS is on" .Values.gateway.tls.certificateSecret }}
    {{- end }}
---
# Single entry point: /api/chat -> chatbot, every other /api path -> api (longest prefix wins).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullname }}
      sectionName: {{ ternary "https" "http" $tls }}
  {{- with .Values.gateway.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/chat }
      backendRefs:
        - { name: {{ $fullname }}-chatbot, port: 8000 }
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - { name: {{ $fullname }}-api, port: 8000 }
{{- if $tls }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-https-redirect
  labels:
    {{- include "vishue.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullname }}
      sectionName: http
  {{- with .Values.gateway.hostname }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
