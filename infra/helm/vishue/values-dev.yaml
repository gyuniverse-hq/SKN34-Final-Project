# Shared dev environment on the same EKS cluster (namespace vishue-dev, release vishue-dev).
# Deployed by .github/workflows/images.yml on every merge to develop (image tag set there).
env: development

image:
  registry: ghcr.io/gyuniverse-hq
  tag: ""

supabase:
  url: ""             # set before first deploy: https://<project>.supabase.co (public)
  publishableKey: ""  # set before first deploy (public key, not the secret key)

api:
  replicas: 1
  autoscaling: { enabled: false }

chatbot:
  replicas: 1
  autoscaling: { enabled: false }
  env:
    LLM_MODEL: ""     # set to enable the chatbot (the key lives in vishue/dev/chatbot)

# The catalog in Git (backend/api/seed/catalog.json) is reloaded on every deploy.
seedOnDeploy: true

podDisruptionBudget:
  enabled: false

# PostgreSQL is the team's shared Supabase database; Redis and Neo4j run in the namespace.
dataStores:
  postgres: { enabled: false }
  redis: { enabled: true }
  neo4j: { enabled: true, password: vishue-dev-graph }

gateway:
  hostname: ""        # e.g. dev-api.<domain>; empty answers on the load balancer address

# AWS Secrets Manager (created by infra/terraform/aws, values added by hand):
#   vishue/dev/api      {"DATABASE_URL": "<Supabase session pooler URL>", "NAVER_CLIENT_ID": ...,
#                        "NAVER_CLIENT_SECRET": ..., "YOUTUBE_API_KEY": ...}
#   vishue/dev/chatbot  {"LLM_API_KEY": ...}
externalSecrets:
  enabled: true
  apiKey: vishue/dev/api
  chatbotKey: vishue/dev/chatbot
