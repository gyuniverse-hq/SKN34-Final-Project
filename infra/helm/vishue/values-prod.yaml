# AWS EKS (ap-northeast-2). See docs/DEPLOYMENT.md and ADR-0011 / ADR-0012.
env: production

admin:
  enabled: true
  # Gateway serves admin at / and api at /api — same origin for the browser.
  apiBaseUrl: ""

api:
  # Single writer while lip-eval uses an RWO PVC (eval period). Re-enable HPA after teardown.
  replicas: 1
  autoscaling:
    enabled: false
  env:
    LOG_LEVEL: INFO
    CATALOG_CACHE_SECONDS: "300"
    ADMIN_ENABLED: "true"
    ADMIN_LIP_EVAL_DIR: "/data/lip-eval"
    # In-cluster chatbot health for admin Ops (Phase B).
    CHATBOT_BASE_URL: "http://vishue-chatbot:8000"
  persistence:
    lipEval:
      enabled: true
      size: 20Gi
      # Empty = cluster default (often gp2/gp3). Prefer RWX/EFS if api replicas > 1.
      storageClassName: ""
      mountPath: /data/lip-eval

image:
  # Temporary cutover registry (ECR in the camp account). Switch back to GHCR after org push rights exist.
  registry: 027099020675.dkr.ecr.ap-northeast-2.amazonaws.com
  tag: "sha-2f5710e"
  pullPolicy: IfNotPresent

supabase:
  url: "https://htlykvanutehqgqufytf.supabase.co"
  publishableKey: "sb_publishable_PkuU3u1TW9U0GNeIjUIWPg_mmXViX5T"

chatbot:
  env:
    G1_SUPERVISOR_ENABLED: "true"
    # Neo4j/AuraDB retired (ADR-0012). Knowledge uses RDS pgvector (#261).
    NEO4J_URI: ""
    LLM_MODEL: "gpt-6-luna"
    LLM_BASE_URL: "https://api.openai.com/v1"

# No Neo4j copy job in production; knowledge is on RDS pgvector.
syncGraph:
  schedule: "0 0 1 1 *"
  runAfterDeploy: false

gateway:
  # Empty = accept any Host (NLB DNS works for Expo). Set api.<domain> when DNS exists.
  hostname: ""
  tls:
    enabled: false
    certificateSecret: ""

# Secrets come from AWS Secrets Manager through External Secrets Operator:
#   vishue/production/api      {"DATABASE_URL": ..., "REDIS_URL": ..., "NAVER_*", "YOUTUBE_API_KEY", "SUPABASE_SECRET_KEY"}
#   vishue/production/chatbot  {"REDIS_URL": ..., "LLM_API_KEY": ...}
externalSecrets:
  enabled: true
