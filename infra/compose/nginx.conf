# Local stand-in for the Kubernetes Gateway (same routes as infra/helm/vishue/templates/gateway.yaml).
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

upstream api     { server api:8000; }
upstream chatbot { server chatbot:8000; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=per_ip burst=40 nodelay;
    limit_req_status 429;

    location /api/chat {
        proxy_pass http://chatbot;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
