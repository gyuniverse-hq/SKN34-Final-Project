# Local stand-in for the Kubernetes Gateway (same routes as infra/helm/vishue/templates/gateway.yaml).
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;

# Docker's DNS. Upstreams are looked up per request, so nginx starts even if the chatbot is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req zone=per_ip burst=40 nodelay;
    limit_req_status 429;

    location /api/chat {
        set $chatbot http://chatbot:8000;
        proxy_pass $chatbot;
        proxy_read_timeout 60s;
        error_page 502 503 504 = @chatbot_down;
    }

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        error_page 502 503 504 = @api_down;
    }

    # Toss checkout pages opened in the phone browser.
    location /pay/ {
        set $api http://api:8000;
        proxy_pass $api;
        error_page 502 503 504 = @api_down;
    }

    location @chatbot_down {
        default_type application/json;
        return 503 '{"error":"Chatbot is temporarily unavailable","code":"chatbot_unavailable"}';
    }

    location @api_down {
        default_type application/json;
        return 503 '{"error":"Service is temporarily unavailable","code":"unavailable"}';
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
