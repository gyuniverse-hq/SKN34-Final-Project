# Local full stack. Run from the repository root:
#   docker compose -f infra/compose/compose.yaml --env-file .env up --build
# Only the gateway (:8080) is reachable from the LAN (Expo Go on a phone); data stores bind to 127.0.0.1
# on 15432/16379/17474/17687 so they never clash with a PostgreSQL or Redis already installed on the PC.
# Override any host port in .env (GATEWAY_PORT, POSTGRES_HOST_PORT, REDIS_HOST_PORT, NEO4J_*_HOST_PORT).
name: vishue

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    ENV: local
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SUPABASE_URL: ${SUPABASE_URL:-${EXPO_PUBLIC_SUPABASE_URL:-}}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
    # Expo web (`npx expo start --web`) calls the gateway from another origin.
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8081"]}'

x-ready: &ready
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # Waits for api only: shopping keeps working while the chatbot is down (nginx answers 503 for chat).
  gateway:
    image: nginx:1.29-alpine
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  api:
    <<: *backend
    build: ../../backend/api
    image: vishue-api:dev
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+asyncpg://vishue:${POSTGRES_PASSWORD:-vishue}@postgres:5432/vishue
      REDIS_URL: redis://redis:6379/0
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      <<: *ready

  chatbot:
    <<: *backend
    build: ../../backend/chatbot
    image: vishue-chatbot:dev
    environment:
      <<: *backend-env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vishue-local}
      REDIS_URL: redis://redis:6379/1
      CATALOG_API_URL: http://api:8000
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      <<: *ready

  # One-off jobs: schema migration before api starts, graph sync once api is ready.
  migrate:
    image: vishue-api:dev
    build: ../../backend/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://vishue:${POSTGRES_PASSWORD:-vishue}@postgres:5432/vishue
    depends_on:
      postgres: { condition: service_healthy }

  sync-graph:
    image: vishue-chatbot:dev
    build: ../../backend/chatbot
    command: ["python", "-m", "app.jobs.sync_graph"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-vishue-local}
      CATALOG_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  # `docker compose ... run --rm seed` to load backend/api/seed/catalog.json, then rerun sync-graph.
  seed:
    image: vishue-api:dev
    build: ../../backend/api
    command: ["python", "-m", "app.jobs.seed_catalog", "seed/catalog.json"]
    environment:
      DATABASE_URL: postgresql+asyncpg://vishue:${POSTGRES_PASSWORD:-vishue}@postgres:5432/vishue
      # Same Redis as api, so the import clears the cached product listings.
      REDIS_URL: redis://redis:6379/0
    volumes: ["../../backend/api/seed:/app/seed:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    profiles: ["tools"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vishue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vishue}
      POSTGRES_DB: vishue
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishue -d vishue"]
      <<: *ready
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *ready
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    # The image reads every NEO4J_* variable as a setting and refuses unknown ones: add no others.
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-vishue-local}
      NEO4J_server_memory_heap_max__size: 512m
    ports: ["127.0.0.1:${NEO4J_HTTP_HOST_PORT:-17474}:7474", "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-17687}:7687"]
    volumes: ["neo4j-data:/data"]
    healthcheck:
      # HTTP comes up after Bolt; cypher-shell starts a JVM and is too slow for a probe.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      <<: *ready
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
