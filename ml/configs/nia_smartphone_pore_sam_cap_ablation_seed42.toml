# Pore-only cap ablation: same protocol as today's SAM candidate, uncapped.
[data]
root = "../data/028.한국인 피부상태 측정 데이터"
output = "runs/nia-smartphone-data-v1-seed-42"

[train]
output = "runs/nia-pore-sam-cap-ablation/uncapped-seed-42"
seed = 42
device_uuid = "GPU-9ed09563-0d58-cdc7-f6bc-b2c84d8da0e3"
batch_size = 16
effective_batch = 16
num_workers = 4
freeze_epochs = 2
finetune_epochs = 18
head_lr = 0.001
