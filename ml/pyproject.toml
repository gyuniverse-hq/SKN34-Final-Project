[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skin-analysis-training"
version = "0.1.0"
description = "Audited, image-level multilabel ResNet-50 skin analysis research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
  "ImageHash>=4.3.2,<5",
  "opencv-python-headless==4.14.0.94",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.hatch.build.targets.wheel]
packages = ["src/skin_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
