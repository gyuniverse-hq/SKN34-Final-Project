name: secrets

# Blocks accidental credential commits. Required path for ADR-0011 cutover quality gates.
on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        env:
          # HEAD is the proposed merge on PRs. Protected-branch pushes also audit other refs.
          SCAN_REF: ${{ github.event_name == 'pull_request' && 'HEAD' || '--all' }}
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --log-opts="--full-history --diff-filter=tuxdb $SCAN_REF"
