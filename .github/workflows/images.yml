name: images

# Publishes immutable images (tag = short git SHA) to GHCR.
#   develop: deploys the dev environment on EKS directly (helm upgrade, namespace vishue-dev).
#   main:    opens a PR that points values-prod.yaml at the new tag; Argo CD deploys on merge.
on:
  push:
    branches: [develop, main]
    paths: ["backend/**", "infra/helm/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service: [api, chatbot]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vishue-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: backend/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  bump-prod:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Point values-prod.yaml at the new images
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${TAG}\"/" infra/helm/vishue/values-prod.yaml
          grep -n "^  tag: \"${TAG}\"" infra/helm/vishue/values-prod.yaml
      - uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so the required
          # ci-ok check would never run. DEPLOY_PR_TOKEN is a fine-grained PAT (contents + PRs).
          token: ${{ secrets.DEPLOY_PR_TOKEN || github.token }}
          branch: chore/deploy-prod-images
          base: main
          commit-message: "chore: 운영 이미지 태그를 ${{ steps.tag.outputs.value }}로 갱신"
          title: "chore: 운영 이미지 태그를 ${{ steps.tag.outputs.value }}로 갱신"
          body: |
            ## 변경 사항
            - 운영 배포 이미지(`vishue-api`, `vishue-chatbot`)를 `${{ steps.tag.outputs.value }}`로 바꿉니다.
            - 병합하면 Argo CD가 EKS에 롤링 배포합니다. 되돌리려면 이 PR의 커밋을 revert합니다.

            ## 영향 범위
            - `infra/helm/vishue/values-prod.yaml`: 운영 이미지 태그
          delete-branch: true

  # Skipped until the AWS dev environment exists (repository variables set by Terraform outputs).
  deploy-dev:
    needs: publish
    if: github.ref == 'refs/heads/develop' && vars.AWS_DEV_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v5
      - run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "$AWS_REGION"
      - name: Deploy dev (migrations, seed and graph sync run as part of the release)
        run: |
          helm upgrade --install vishue-dev infra/helm/vishue \
            --namespace vishue-dev \
            -f infra/helm/vishue/values-dev.yaml \
            --set image.tag="sha-${GITHUB_SHA::7}" \
            --wait --timeout 15m
